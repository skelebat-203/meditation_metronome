<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Meditation Metronome</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="slideshow" aria-hidden="true"></div>
  <div id="status" class="visually-hidden" aria-live="polite"></div>

  <main id="screen-launch" class="screen screen-launch" aria-labelledby="launch-title" hidden>
    <h1 id="launch-title" class="visually-hidden">Meditation Metronome</h1>
    <button type="button" class="btn btn-icon btn-top-right" data-action="open-settings">
      <span aria-hidden="true">⚙</span> Settings
    </button>
    <div class="launch-center">
      <button type="button" id="start" class="btn btn-start" data-action="start">Start</button>
      <ul class="toggle-row" aria-label="This session">
        <li><button type="button" class="btn btn-toggle" data-toggle="music" aria-pressed="true"><span aria-hidden="true">♪</span> Music <span class="toggle-state" aria-hidden="true"></span></button></li>
        <li><button type="button" class="btn btn-toggle" data-toggle="metronome" aria-pressed="true"><span aria-hidden="true">◷</span> Metronome <span class="toggle-state" aria-hidden="true"></span></button></li>
        <li><button type="button" class="btn btn-toggle" data-toggle="images" aria-pressed="true"><span aria-hidden="true">▣</span> Images <span class="toggle-state" aria-hidden="true"></span></button></li>
      </ul>
    </div>
  </main>

  <main id="screen-meditation" class="screen screen-meditation" aria-labelledby="meditation-title" hidden>
    <h1 id="meditation-title" class="visually-hidden">Meditation session</h1>
    <div class="controls">
      <button type="button" class="btn btn-large btn-top-left" data-action="end"><span aria-hidden="true">■</span> End</button>
      <button type="button" class="btn btn-large btn-top-right" data-action="open-settings"><span aria-hidden="true">⚙</span> Session settings</button>
    </div>
    <p id="session-timer" class="session-timer" role="timer" hidden><span>0:00</span></p>
  </main>

  <main id="screen-settings" class="screen screen-settings" aria-labelledby="settings-title" hidden>
    <header class="settings-header">
      <button type="button" class="btn" data-action="back"><span aria-hidden="true">←</span> Back</button>
      <h1 id="settings-title" tabindex="-1">Settings</h1>
    </header>
    <form id="settings-form" class="settings-form">
      <div class="settings-columns">
        <section class="settings-group" aria-labelledby="settings-music">
          <h2 id="settings-music">Music</h2>
          <label class="setting"><span>Music</span> <input type="checkbox" id="music" name="music" class="switch"></label>
          <label class="setting" for="music-volume"><span>Music volume</span> <output for="music-volume" class="volume-value" aria-hidden="true"></output></label>
          <input type="range" id="music-volume" name="musicVolume" min="0" max="100" step="5">
          <label class="setting" for="track"><span>Track</span></label>
          <select id="track" name="track"></select>
          <button type="button" class="btn track-preview" data-action="preview-track"><span aria-hidden="true">▶</span> Play 5 s of track</button>
        </section>
        <section class="settings-group" aria-labelledby="settings-metronome">
          <h2 id="settings-metronome">Metronome</h2>
          <label class="setting"><span>Metronome</span> <input type="checkbox" id="metronome" name="metronome" class="switch"></label>
          <label class="setting" for="metronome-volume"><span>Metronome volume</span> <output for="metronome-volume" class="volume-value" aria-hidden="true"></output></label>
          <input type="range" id="metronome-volume" name="metronomeVolume" min="0" max="100" step="5">
          <fieldset id="tick-sound" class="tick-sounds">
            <legend>Tick sound</legend>
            <div class="tick-sound"><label><input type="radio" name="tickSound" value="soft-click"> Soft click</label> <button type="button" class="btn btn-small" data-preview="soft-click" aria-label="Play soft click">▶</button></div>
              <div class="tick-sound"><label><input type="radio" name="tickSound" value="wood-block"> Wood block</label> <button type="button" class="btn btn-small" data-preview="wood-block" aria-label="Play wood block">▶</button></div>
              <div class="tick-sound"><label><input type="radio" name="tickSound" value="bell"> Bell</label> <button type="button" class="btn btn-small" data-preview="bell" aria-label="Play bell">▶</button></div>
          </fieldset>
        </section>
        <section class="settings-group" aria-labelledby="settings-display">
          <h2 id="settings-display">Display</h2>
          <label class="setting"><span>Images</span> <input type="checkbox" id="images" name="images" class="switch"></label>
          <label class="setting"><span>Session timer</span> <input type="checkbox" id="timer" name="timer" class="switch"></label>
          <label class="setting"><span>Keep screen awake</span> <input type="checkbox" id="keep-awake" name="keepAwake" class="switch"></label>
        </section>
      </div>
      <div class="settings-actions">
        <button type="button" class="btn" data-action="apply-persistent">Persistent</button>
        <button type="button" class="btn" data-action="apply-session">This session</button>
      </div>
    </form>
  </main>

  <!-- Classic scripts, not ES modules: modules are blocked when index.html is opened from file://. -->
  <script src="js/constants.js"></script>
  <script src="js/metronome.js"></script>
  <script src="js/music.js"></script>
  <script src="js/slideshow.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
