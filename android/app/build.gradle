// Plain Java, no AndroidX or other libraries: the APK holds the WebView shell and the web app.
plugins {
    id 'com.android.application'
}

def appId = 'io.github.skelebat203.meditationmetronome'
def sdkMin = 21
def sdkTarget = 35

// Web app version comes from the root package.json (one version for web and APK).
// versionCode is a literal there too, so F-Droid's update checker can read it;
// the build fails if it does not match major*10000 + minor*100 + patch, or if minor or patch
// is outside 0..99 (the formula would then collide or go out of order).
def webRoot = rootDir.parentFile
def pkg = new groovy.json.JsonSlurper().parse(new File(webRoot, 'package.json'))
def appVersion = pkg.version
def versionParts = appVersion.tokenize('.').collect { it as int }
def versionPartMax = 99
if (versionParts.size() != 3 || versionParts[1..2].any { it < 0 || it > versionPartMax }) {
    throw new GradleException("package.json version ${appVersion} must be major.minor.patch with minor and patch 0..${versionPartMax}")
}
def appVersionCode = pkg.versionCode as int
def expectedVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
if (appVersionCode != expectedVersionCode) {
    throw new GradleException("package.json versionCode ${appVersionCode} != ${expectedVersionCode} for version ${appVersion}")
}

android {
    namespace appId
    compileSdk sdkTarget

    defaultConfig {
        applicationId appId
        minSdk sdkMin
        targetSdk sdkTarget
        versionName appVersion
        versionCode appVersionCode
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // F-Droid builds this unsigned and signs it itself. Not debuggable, so WebView debugging stays off.
            debuggable false
            minifyEnabled false
            // No git commit info in the APK: keeps builds identical across checkouts.
            vcsInfo.include false
        }
    }

    // No Google-signed dependency-info block in the APK/bundle (F-Droid rejects it).
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    buildFeatures {
        buildConfig false
    }
}

// Copy the web app from the repo root into the APK's assets at build time (no second copy in git).
def webAssetsDir = layout.buildDirectory.dir('generated/web')
def copyWebAssets = tasks.register('copyWebAssets', Sync) {
    from(webRoot) {
        include 'index.html', 'css/**', 'js/**', 'assets/**'
    }
    into webAssetsDir.map { it.dir('web') }
}
android.sourceSets.main.assets.srcDir(webAssetsDir)
tasks.named('preBuild') { dependsOn copyWebAssets }
